# Two caches: one for the storefront, one for the API responses worth reusing.
proxy_cache_path /var/cache/nginx/site levels=1:2 keys_zone=site_cache:10m max_size=200m inactive=30m use_temp_path=off;
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=10m use_temp_path=off;

# Default upstream behaviour is round robin: each request goes to the next server.
# The zone keeps that rotation shared between nginx's worker processes; without
# it each worker counts independently and the spread looks uneven.
upstream api {
    zone api_zone 64k;
    server yi:3000;
    server er:3000;
    server san:3000;
}

server {
    listen 80;

    # Makes cache and load balancing visible while testing.
    add_header X-Cache-Status $upstream_cache_status always;
    add_header X-Upstream $upstream_addr always;

    # Book details: a GET that only changes when the book itself changes.
    # Quoted, because unquoted {24} would be parsed as a config block.
    location ~ "^/api/books/([0-9a-fA-F]{24})$" {
        proxy_cache api_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_lock on;
        proxy_pass http://api/books/$1;
    }

    # Unfiltered book list. The adapter posts here, sending X-Book-Filters only
    # when filters are applied; those requests bypass the cache and are never
    # stored in it.
    location = /api/books/list {
        proxy_cache api_cache;
        proxy_cache_key "unfiltered-book-list";
        proxy_cache_valid 200 60s;
        proxy_cache_methods GET HEAD POST;
        proxy_cache_lock on;
        proxy_cache_bypass $http_x_book_filters;
        proxy_no_cache $http_x_book_filters;
        proxy_pass http://api/books/list;
    }

    # Everything else under /api is dynamic, so no caching.
    location /api/ {
        proxy_pass http://api/;
    }

    # The storefront is static but its dev server sends no-cache, so ignore
    # those headers and cache it here instead.
    location / {
        proxy_cache site_cache;
        proxy_cache_valid 200 10m;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_pass http://front-end:9080/;
    }
}
